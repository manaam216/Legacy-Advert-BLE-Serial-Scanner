name: 🧠 BLE Scanner CI (NCS Docker v2.7.0)

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ble-scanner:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:latest
      options: --user root  # ensure file permissions work properly

    defaults:
      run:
        shell: bash

    env:
      PROJECT_DIR: legacy_ble_serial_scanner
      BOARD: nrf52840dk_nrf52840

    steps:
      - name: 🧩 Checkout BLE Scanner project
        uses: actions/checkout@v4
        with:
          path: ${{ env.PROJECT_DIR }}

      - name: ⚙️ Prepare west workspace
        run: |
          export PATH=$PATH:${HOME}/.local/bin
          west init -l $PROJECT_DIR
          west update -o=--depth=1 -n
          apt-get update -y && apt-get install -y build-essential

      - name: 🏗️ Build firmware
        run: |
          cd $PROJECT_DIR
          west build --build-dir build . --pristine \
            -DBOARD_ROOT=. \
            -DNCS_TOOLCHAIN_VERSION=NONE \
            -DCONF_FILE=prj.conf \
            --board $BOARD
          ls -lh build/zephyr/zephyr.*

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ble_scanner_firmware_${{ env.BOARD }}
          path: ${{ env.PROJECT_DIR }}/build/zephyr/zephyr.*
