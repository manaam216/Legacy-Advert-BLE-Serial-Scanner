name: 🧠 Zephyr BLE Scanner CI (NCS Docker)

on:
  push:
    branches: [ main, master, test ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build with NCS Docker
    runs-on: ubuntu-latest

    container:
      image: nordicsemiconductor/nrfconnect-sdk:latest
      options: --user root  # run as root for file access

    env:
      BOARD: nrf52840dk_nrf52840

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Build application with West
        run: |
          echo "Using NCS Docker image: $(west --version)"
          west build -b $BOARD -d build/ .
          ls -lh build/zephyr/zephyr.*

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.BOARD }}
          path: build/zephyr/zephyr.*
