# -----------------
# Bluetooth Scanning
# -----------------
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_SCAN=y
CONFIG_BT_DEVICE_NAME="WePowerScanner"
CONFIG_BT_DEVICE_APPEARANCE=0

# -----------------
# Logging / UART
# -----------------
CONFIG_PRINTK=y
CONFIG_LOG=y


# -----------------
# Crypto (AES-ECB)
# -----------------
CONFIG_HW_CC3XX=n
CONFIG_ENTROPY_CC3XX=n
CONFIG_ENTROPY_NRF5_RNG=y
CONFIG_CC3XX_BACKEND=n
# Software Crypto with Mbed
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_HEAP_SIZE=512
CONFIG_MBEDTLS_CIPHER_CCM_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
CONFIG_CRYPTO=y
CONFIG_CRYPTO_MBEDTLS_SHIM=y


# -----------------
# Power / Optimizations
# -----------------
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=6144

CONFIG_CRC=y
